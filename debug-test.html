<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <h2>Fortschrittsbalken Test</h2>
        <div class="config-section">
            <h4>Checkliste-Übersicht Test</h4>
            <table class="info-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Pflicht %</th>
                        <th>Gesamt %</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><a href="#" target="_blank">Test Checkliste 1</a></td>
                        <td><strong class="progress-cell" style="--progress-width: 85%; --progress-color: #28a745;">85%</strong></td>
                        <td><strong class="progress-cell" style="--progress-width: 92%; --progress-color: #28a745;">92%</strong></td>
                    </tr>
                    <tr>
                        <td><a href="#" target="_blank">Test Checkliste 2</a></td>
                        <td><strong class="progress-cell" style="--progress-width: 65%; --progress-color: #6cc04a;">65%</strong></td>
                        <td><strong class="progress-cell" style="--progress-width: 71%; --progress-color: #6cc04a;">71%</strong></td>
                    </tr>
                    <tr>
                        <td><a href="#" target="_blank">Test Checkliste 3</a></td>
                        <td><strong class="progress-cell" style="--progress-width: 45%; --progress-color: #ffc107;">45%</strong></td>
                        <td><strong class="progress-cell" style="--progress-width: 38%; --progress-color: #ffc107;">38%</strong></td>
                    </tr>
                    <tr>
                        <td><a href="#" target="_blank">Test Checkliste 4</a></td>
                        <td><strong class="progress-cell" style="--progress-width: 25%; --progress-color: #fd7e14;">25%</strong></td>
                        <td><strong class="progress-cell" style="--progress-width: 19%; --progress-color: #dc3545;">19%</strong></td>
                    </tr>
                    <tr>
                        <td><a href="#" target="_blank">Test Checkliste 5</a></td>
                        <td><strong class="progress-cell" style="--progress-width: 5%; --progress-color: #dc3545;">5%</strong></td>
                        <td><strong class="progress-cell" style="--progress-width: 12%; --progress-color: #dc3545;">12%</strong></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
